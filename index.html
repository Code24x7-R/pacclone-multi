<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pacclone Multi</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👻</text></svg>">
    <style>
        :root {
            --bg: #0a0a1a;
            --panel: #12122a;
            --panel-border: #2a2a55;
            --accent: #ffe600;      /* Pac-Man yellow */
            --accent2: #00e5ff;     /* cyan */
            --accent3: #ff4da6;     /* pink */
            --text: #f0f0ff;
            --text-dim: #8888bb;
            --p1: #ffe600;
            --p2: #39ff14;
            --p3: #00e5ff;
            --p4: #ff4da6;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: var(--bg);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Segoe UI', 'Trebuchet MS', system-ui, sans-serif;
            color: var(--text);
            overflow: hidden;
        }
        canvas { background-color: #000; display: none; }

        /* Responsive canvas: scale down to fit small screens while preserving
         * the 800x520 (20:13) aspect ratio. Without this, the maze overflows
         * the viewport on phones and the player can move off-screen.
         * touch-action: none prevents the browser from scrolling/zooming
         * when the player touches the canvas to use the joystick. */
        #gameCanvas {
            width: 100%;
            max-width: 800px;
            height: auto;
            aspect-ratio: 800 / 520;
            touch-action: none;
        }

        /* --- Animated background dots (maze vibe) --- */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                radial-gradient(circle at 20% 30%, rgba(255,230,0,0.06) 0 2px, transparent 3px),
                radial-gradient(circle at 70% 60%, rgba(0,229,255,0.05) 0 2px, transparent 3px),
                radial-gradient(circle at 50% 80%, rgba(255,77,166,0.05) 0 2px, transparent 3px);
            background-size: 60px 60px, 80px 80px, 100px 100px;
            pointer-events: none;
            animation: bgdrift 20s linear infinite;
            z-index: 0;
        }
        @keyframes bgdrift {
            from { background-position: 0 0, 0 0, 0 0; }
            to   { background-position: 0 60px, 0 80px, 0 100px; }
        }

        /* --- Lobby container --- */
        #lobby {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: min(520px, 92vw);
            max-height: 92vh;
            overflow-y: auto;
            padding: 28px 32px 24px;
            background: linear-gradient(160deg, var(--panel) 0%, #0e0e24 100%);
            border: 2px solid var(--panel-border);
            border-radius: 18px;
            box-shadow:
                0 0 60px rgba(0,229,255,0.12),
                0 0 120px rgba(255,230,0,0.06),
                0 20px 50px rgba(0,0,0,0.6);
        }

        /* --- Title --- */
        .lobby-title {
            font-size: 2.4rem;
            font-weight: 800;
            letter-spacing: 3px;
            margin: 0 0 2px;
            text-transform: uppercase;
            background: linear-gradient(90deg, var(--p1), #fff6a8 50%, var(--p1));
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 12px rgba(255,230,0,0.5));
        }
        .lobby-subtitle {
            font-size: 0.82rem;
            color: var(--text-dim);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin: 0 0 22px;
        }

        /* --- Name row --- */
        .name-row {
            display: flex;
            gap: 8px;
            width: 100%;
            margin-bottom: 20px;
        }
        .name-row input {
            flex: 1;
            padding: 11px 14px;
            font-size: 15px;
            background: #0c0c20;
            color: var(--text);
            border: 1.5px solid var(--panel-border);
            border-radius: 10px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .name-row input:focus {
            border-color: var(--accent2);
            box-shadow: 0 0 0 3px rgba(0,229,255,0.15);
        }
        .name-row input::placeholder { color: var(--text-dim); }

        /* --- Buttons --- */
        .btn {
            padding: 11px 20px;
            font-size: 15px;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.2s, background 0.2s;
            color: #000;
        }
        .btn:active { transform: scale(0.96); }
        .btn-yellow { background: var(--accent); }
        .btn-yellow:hover { box-shadow: 0 0 18px rgba(255,230,0,0.5); }
        .btn-cyan   { background: var(--accent2); }
        .btn-cyan:hover   { box-shadow: 0 0 18px rgba(0,229,255,0.5); }
        .btn-ghost {
            background: transparent;
            color: var(--text-dim);
            border: 1.5px solid var(--panel-border);
        }
        .btn-ghost:hover { color: var(--text); border-color: var(--accent2); }
        .btn-leave {
            background: rgba(255,60,60,0.15);
            color: #ff6b6b;
            border: 1.5px solid rgba(255,60,60,0.4);
        }
        .btn-leave:hover { background: rgba(255,60,60,0.3); color: #ff9b9b; border-color: #ff6b6b; }
        .btn-ready {
            background: rgba(74,224,128,0.15);
            color: #4ade80;
            border: 1.5px solid rgba(74,224,128,0.4);
        }
        .btn-ready:hover { background: rgba(74,224,128,0.3); color: #7aedad; border-color: #4ade80; }
        .btn-ready.active {
            background: rgba(74,224,128,0.35);
            color: #fff;
            border-color: #4ade80;
            box-shadow: 0 0 14px rgba(74,224,128,0.4);
        }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; box-shadow: none; }

        /* --- Start button (prominent) --- */
        .btn-start {
            width: 100%;
            padding: 15px;
            font-size: 1.15rem;
            font-weight: 800;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            background: linear-gradient(90deg, #16a340, #22c55e);
            color: #fff;
            border-radius: 12px;
            margin-top: 6px;
        }
        .btn-start:not(:disabled) {
            animation: pulse 2s ease-in-out infinite;
        }
        .btn-start:hover:not(:disabled) {
            box-shadow: 0 0 24px rgba(34,197,94,0.6);
            animation: none;
        }
        .btn-start:disabled {
            background: #2a2a40;
            color: var(--text-dim);
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 8px rgba(34,197,94,0.3); }
            50%      { box-shadow: 0 0 22px rgba(34,197,94,0.6); }
        }

        /* --- Section headings --- */
        .section-h {
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--text-dim);
            margin: 0 0 10px;
            width: 100%;
        }

        /* --- Player list --- */
        .player-list {
            list-style: none;
            padding: 0;
            margin: 0 0 18px;
            width: 100%;
        }
        .player-slot {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            margin-bottom: 8px;
            background: rgba(255,255,255,0.03);
            border: 1.5px solid transparent;
            border-radius: 10px;
            transition: background 0.2s, border-color 0.2s;
        }
        .player-slot.filled {
            border-color: var(--slot-color, var(--panel-border));
            background: rgba(255,255,255,0.04);
        }
        .player-slot.empty {
            opacity: 0.45;
            border-style: dashed;
            border-color: var(--panel-border);
        }
        .player-dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            flex-shrink: 0;
            background: var(--slot-color);
            box-shadow: 0 0 8px var(--slot-color);
        }
        .player-dot.empty-dot {
            background: transparent;
            border: 1.5px solid var(--text-dim);
            box-shadow: none;
        }
        .player-name {
            font-size: 15px;
            font-weight: 600;
            flex: 1;
        }
        .player-tag {
            font-size: 0.68rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            padding: 3px 8px;
            border-radius: 6px;
            background: rgba(255,230,0,0.15);
            color: var(--accent);
        }
        .player-tag.you {
            background: rgba(0,229,255,0.15);
            color: var(--accent2);
        }
        .player-ready {
            font-size: 0.68rem;
            font-weight: 600;
            padding: 3px 8px;
            border-radius: 6px;
            background: rgba(255,255,255,0.06);
            color: var(--text-dim);
            white-space: nowrap;
        }
        .player-ready.is-ready {
            background: rgba(74,224,128,0.18);
            color: #4ade80;
        }

        /* --- Countdown overlay (feature D) --- */
        .countdown-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            z-index: 20;
        }
        .countdown-number {
            font-size: 7rem;
            font-weight: 800;
            color: var(--accent);
            text-shadow: 0 0 30px rgba(255,230,0,0.6), 0 0 60px rgba(255,230,0,0.3);
            opacity: 0;
        }
        .countdown-pop {
            animation: countdownPop 0.9s ease-out;
        }
        @keyframes countdownPop {
            0% { opacity: 0; transform: scale(0.4); }
            25% { opacity: 1; transform: scale(1.15); }
            70% { opacity: 1; transform: scale(1); }
            100% { opacity: 0.85; transform: scale(1); }
        }

        /* --- High scores --- */
        .scores-list {
            list-style: none;
            padding: 0;
            margin: 0 0 18px;
            width: 100%;
            counter-reset: rank;
        }
        .scores-list li {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 7px 12px;
            margin-bottom: 4px;
            font-size: 14px;
            border-radius: 8px;
            background: rgba(255,230,0,0.04);
        }
        .scores-list li:nth-child(1) { background: rgba(255,230,0,0.10); }
        .score-rank {
            font-weight: 800;
            color: var(--accent);
            min-width: 22px;
        }
        .score-name { flex: 1; font-weight: 600; }
        .score-val {
            font-variant-numeric: tabular-nums;
            color: var(--accent2);
            font-weight: 700;
        }
        .scores-empty {
            color: var(--text-dim);
            font-size: 13px;
            text-align: center;
            padding: 10px;
        }

        /* --- Host status --- */
        #hostStatus {
            margin: 12px 0 0;
            font-size: 13px;
            text-align: center;
            min-height: 20px;
            width: 100%;
        }

        /* --- Footer row (mute) --- */
        .lobby-footer {
            margin-top: 16px;
            width: 100%;
            display: flex;
            justify-content: center;
        }
    </style>
</head>
<body>
    <div id="lobby">
        <h1 class="lobby-title">Pacclone Multi</h1>
        <p class="lobby-subtitle">Last player standing wins</p>

        <div class="name-row">
            <input type="text" id="playerNameInput" placeholder="Enter your name" maxlength="16">
            <button id="joinLobbyButton" class="btn btn-yellow">Join</button>
            <button id="readyButton" class="btn btn-ready" style="display: none;">Ready</button>
        </div>

        <div class="section-h">Players · up to 4</div>
        <ul id="playersList" class="player-list"></ul>

        <div class="section-h">High Scores</div>
        <ol id="highScoresList" class="scores-list"></ol>

        <button id="startGameButton" class="btn btn-start" disabled>Start Game</button>
        <div id="hostStatus"></div>

        <!-- Countdown overlay (feature D): shown during COUNTDOWN state. -->
        <div id="countdownOverlay" class="countdown-overlay" style="display: none;">
            <div id="countdownNumber" class="countdown-number">3</div>
        </div>

        <div class="lobby-footer">
            <button id="muteButton" class="btn btn-ghost">Mute</button>
        </div>
    </div>
    <canvas id="gameCanvas" width="800" height="520" style="display: none;"></canvas>
    <button id="leaveButton" class="btn btn-leave" style="display: none; position: absolute; top: 12px; right: 12px; z-index: 10; padding: 6px 14px; font-size: 13px;">Leave Game</button>

    <!-- Virtual Joystick for Touch Controls (NEW) -->
    <div id="joystick" style="display: none; position: fixed; bottom: 50px; left: 50px; width: 100px; height: 100px; background-color: rgba(255, 255, 255, 0.3); border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.5);">
        <div id="joystick-handle" style="position: absolute; top: 25px; left: 25px; width: 50px; height: 50px; background-color: rgba(255, 255, 255, 0.7); border-radius: 50%;"></div>
    </div>

    <script src="src/ghostRenderer.js"></script>
    <script src="src/highScores.js"></script>
    <script src="src/audio.js"></script>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const lobbyDiv = document.getElementById('lobby');
        const playerNameInput = document.getElementById('playerNameInput');
        const joinLobbyButton = document.getElementById('joinLobbyButton');
        const playersList = document.getElementById('playersList');
        const startGameButton = document.getElementById('startGameButton');
        const hostStatus = document.getElementById('hostStatus');
        
        const TILE_SIZE = 40;
        // Slot colors must match server game-start assignment (index-based):
        // server.js createPlayersFromLobby uses ['yellow','lime','cyan','magenta'].
        const LOBBY_SLOT_COLORS = ['var(--p1)', 'var(--p2)', 'var(--p3)', 'var(--p4)'];
        const LOBBY_SLOT_NAMES = ['yellow', 'lime', 'cyan', 'magenta'];
        let myPlayerId = null;
        let myToken = null; // stable identity token echoed by server on join; persists across reconnects
        let currentPlayerName = '';
        let hasJoinedLobby = false; // true once this client has joined the lobby
        let isReady = false; // true once this client has toggled ready (feature C)
        let clientGameState = 'LOBBY'; // Client-side representation of game state
        let isSpectating = false; // true when the player is out of lives and watching
        let lastScore = 0; // for chomp sound
        let lastLives = 0; // for extra-life sound
        let lastPoweredUpState = false; // for power-up sound
        let lastGhostPositions = []; // for ghost eaten sound
        let playerLastDirs = {}; // id -> last non-null direction (for mouth facing)
        let highScores = HighScores.loadHighScores();
        let finalScoreRecorded = false;
        let gameOverSoundPlayed = false; // one-shot guard for game-over SFX
        let showNewHighScore = false; // overlay flag set on game-over
        let showHighScore = false; // overlay flag set on game-over
        let showPosDebug = false; // press 'P' to toggle position-vs-pellet-line debug overlay

        // --- Smooth rendering loop ---
        // The server sends state at 60Hz, but rendering only on packet arrival
        // looks jerky. We store the latest server state and draw it every frame
        // via requestAnimationFrame so the mouth animation, dash glow, and other
        // effects animate smoothly. We render the latest position directly (no
        // interpolation) to avoid input lag — at 60Hz server / 60Hz display this
        // is the most responsive, matching the reference's local game loop.
        var latestServerState = null; // raw state from server
        var renderLoopStarted = false;

        // Handle a return-to-lobby message from the server (player quit mid-game
        // or finished spectating and chose to leave). Transitions the UI back to
        // the lobby, clears game/spectator state, and re-renders the lobby.
        function handleReturnToLobby(message) {
            // Stop drawing the game board.
            renderLoopStarted = false;
            // Clear game-side identity flags. myPlayerId is our stable connection
            // ID — keep it so the server can still identify us.
            isSpectating = false;
            // Show lobby, hide canvas.
            lobbyDiv.style.display = 'flex';
            canvas.style.display = 'none';
            setLeaveButtonVisible(false);
            clientGameState = 'LOBBY';
            // Reset per-game UI state. Returning to the lobby means starting
            // fresh: not ready, no countdown showing.
            lastScore = 0;
            lastLives = 0;
            lastPoweredUpState = false;
            gameOverSoundPlayed = false;
            finalScoreRecorded = false;
            isReady = false;
            renderCountdown(null, 'LOBBY');
            // Re-render the lobby with the server's current player list.
            const lp = message.lobbyPlayers || [];
            const count = renderLobbyPlayers(lp);
            renderHighScores(document.getElementById('highScoresList'));
            // Match on stable token (falls back to clientId).
            const lobbyIdentity = myToken || myPlayerId;
            hasJoinedLobby = lp.some(p => p.id === lobbyIdentity);
            renderJoinState();
            // Reflect host/start-button state for the lobby we're returning to.
            // On a fresh lobby no one is ready yet, so Start stays disabled.
            const isHost = lp.length > 0 && lp[0].id === lobbyIdentity;
            const allReady = lp.length > 0 && lp.every((p) => p.ready);
            startGameButton.disabled = !(isHost && allReady);
            if (count > 0) {
                if (isHost) {
                    hostStatus.textContent = allReady
                        ? 'You are the host — press Start Game!'
                        : 'You are the host — waiting for everyone to ready up…';
                    hostStatus.style.color = allReady ? '#4ade80' : '#fbbf24';
                } else {
                    hostStatus.textContent = `Host: ${lp[0].name} — waiting for players to ready up…`;
                    hostStatus.style.color = '#fbbf24';
                }
            } else {
                hostStatus.textContent = 'Waiting for players to join…';
                hostStatus.style.color = '#aaa';
            }
        }

        // Send a leave-game request to the server. Works whether we are an
        // active player or a spectator.
        function leaveGame() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'leaveGame' }));
            }
        }
        // Render the lobby player list from a lobbyPlayers array. Shared by
        // the lobbyState handler and handleReturnToLobby so both produce
        // identical markup. Shows all 4 slots color-coded to match each
        // player's in-game color (LOBBY_SLOT_COLORS); filled slots get a
        // colored dot + name + Host/You tags; empty slots show a dashed
        // "Waiting for player..." placeholder.
        function renderLobbyPlayers(lobbyPlayersArray) {
            playersList.innerHTML = '';
            const lobbyCount = lobbyPlayersArray ? lobbyPlayersArray.length : 0;
            for (let i = 0; i < 4; i++) {
                const p = lobbyPlayersArray ? lobbyPlayersArray[i] : null;
                const li = document.createElement('li');
                li.className = 'player-slot ' + (p ? 'filled' : 'empty');
                li.style.setProperty('--slot-color', LOBBY_SLOT_COLORS[i]);

                const dot = document.createElement('span');
                dot.className = 'player-dot' + (p ? '' : ' empty-dot');
                li.appendChild(dot);

                const name = document.createElement('span');
                name.className = 'player-name';
                name.textContent = p ? p.name : 'Waiting for player...';
                li.appendChild(name);

                if (p) {
                    if (i === 0) {
                        const tag = document.createElement('span');
                        tag.className = 'player-tag';
                        tag.textContent = 'Host';
                        li.appendChild(tag);
                    }
                    // Tag our own slot by stable token (falls back to clientId).
                    if (p.id === (myToken || myPlayerId)) {
                        const tag = document.createElement('span');
                        tag.className = 'player-tag you';
                        tag.textContent = 'You';
                        li.appendChild(tag);
                    }
                    // Ready indicator (feature C): a checkmark when readied.
                    const ready = document.createElement('span');
                    ready.className = 'player-ready' + (p.ready ? ' is-ready' : '');
                    ready.textContent = p.ready ? '✓ Ready' : 'Not ready';
                    li.appendChild(ready);
                }
                playersList.appendChild(li);
            }
            return lobbyCount;
        }

        // Countdown overlay (feature D): shows a large 3 / 2 / 1 during the
        // COUNTDOWN state, then "GO!" briefly before the match begins. The server
        // sends the current tick in lobbyState.countdown (3/2/1); when the state
        // leaves COUNTDOWN the overlay is hidden.
        function renderCountdown(countdown, state) {
            const overlay = document.getElementById('countdownOverlay');
            const number = document.getElementById('countdownNumber');
            if (state !== 'COUNTDOWN' || countdown === null || countdown === undefined) {
                overlay.style.display = 'none';
                return;
            }
            overlay.style.display = 'flex';
            // countdown tick is 3, 2, or 1.
            number.textContent = countdown > 0 ? String(countdown) : 'GO!';
            number.classList.remove('countdown-pop');
            // Force reflow so the pop animation restarts on each tick.
            void number.offsetWidth;
            number.classList.add('countdown-pop');
        }

        function startRenderLoop() {
            if (renderLoopStarted) return;
            renderLoopStarted = true;
            requestAnimationFrame(renderLoop);
        }
        function renderLoop() {
            if (latestServerState) {
                render(latestServerState);
            }
            requestAnimationFrame(renderLoop);
        }

        // Render the high score list into an element using the HighScores module.
        function renderHighScores(el) {
            if (!el) return;
            if (!highScores || highScores.length === 0) {
                el.innerHTML = '<li class="scores-empty">No scores yet — be the first!</li>';
                return;
            }
            el.innerHTML = highScores.map((e, i) =>
                `<li>` +
                `<span class="score-rank">${i + 1}</span>` +
                `<span class="score-name">${HighScores.escapeHtml(e.name)}</span>` +
                `<span class="score-val">${e.score.toLocaleString()}</span>` +
                `</li>`
            ).join('');
        }

        // Reflect lobby-join state in the UI: once joined, lock the name input,
        // hide the Join button, and reveal the Ready toggle (feature C). The
        // ready button reflects this client's current ready flag.
        function renderJoinState() {
            const readyButton = document.getElementById('readyButton');
            if (hasJoinedLobby) {
                playerNameInput.disabled = true;
                playerNameInput.style.opacity = '0.6';
                joinLobbyButton.style.display = 'none';
                readyButton.style.display = 'inline-block';
                // Reflect ready state on the button.
                if (isReady) {
                    readyButton.textContent = 'Ready ✓';
                    readyButton.classList.add('active');
                } else {
                    readyButton.textContent = 'Ready';
                    readyButton.classList.remove('active');
                }
            } else {
                playerNameInput.disabled = false;
                playerNameInput.style.opacity = '';
                joinLobbyButton.style.display = 'inline-block';
                joinLobbyButton.textContent = 'Join';
                joinLobbyButton.disabled = false;
                joinLobbyButton.classList.remove('btn-cyan');
                joinLobbyButton.classList.add('btn-yellow');
                readyButton.style.display = 'none';
            }
        }

        // --- Audio (src/audio.js — chiptune SFX) ---
        // AudioContext must be created/resumed on a user gesture. We init on the
        // first lobby interaction; until then sounds are no-ops.
        var audioInitialized = false;
        function ensureAudio() {
            if (!audioInitialized) {
                AudioFX.init();
                audioInitialized = true;
            }
        }

        // Map the old sound variables to AudioFX calls so existing trigger
        // points keep working. New sounds (dash, celebrate, extra-life, etc.)
        // are added where the gameplay events occur.
        function playChomp() { ensureAudio(); AudioFX.playChomp(); }
        function playPowerup() { ensureAudio(); AudioFX.playPowerup(); }
        function playGhostEaten() { ensureAudio(); AudioFX.playEatGhost(); }
        function playPlayerEaten() { ensureAudio(); AudioFX.playDeath(); }
        function playGameOver() { ensureAudio(); AudioFX.playGameOver(); }
        function playDash() { ensureAudio(); AudioFX.playDash(); }
        function playCelebrate() { ensureAudio(); AudioFX.playCelebrate(); }
        function playExtraLife() { ensureAudio(); AudioFX.playExtraLife(); }
        function playHighScore() { ensureAudio(); AudioFX.playHighScore(); }

            joystickCurrentY = touch.clientY;

            const deltaX = joystickCurrentX - joystickStartX;
            const deltaY = joystickCurrentY - joystickStartY;

            const maxDistance = joystickBaseSize / 2 - joystickHandleSize / 2;
            const angle = Math.atan2(deltaY, deltaX);
            const distance = Math.min(maxDistance, Math.hypot(deltaX, deltaY));

            const handleX = maxDistance + distance * Math.cos(angle) - joystickHandleSize / 2;
            const handleY = maxDistance + distance * Math.sin(angle) - joystickHandleSize / 2;

            joystickHandle.style.left = `${handleX}px`;
            joystickHandle.style.top = `${handleY}px`;

            let direction = null;
            if (distance > maxDistance * 0.5) { // Only send direction if moved enough
                if (Math.abs(deltaX) > Math.abs(deltaY)) {
                    direction = deltaX > 0 ? 'right' : 'left';

        function render(gameState) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const { maze, players, ghosts, pellets, powerPellets, level = 1 } = gameState;
            const myPlayer = players.find(p => p.id === myPlayerId);

            // NEW: Sound triggers for current player
            if (myPlayer) {
                // Chomp sound
                if (myPlayer.score > lastScore) {
                    playChomp();
                }
                lastScore = myPlayer.score;

                // Power-up sound
                if (myPlayer.poweredUp && !lastPoweredUpState) {
                    playPowerup();
                }
                lastPoweredUpState = myPlayer.poweredUp;
            }

            // Draw maze
            for (let y = 0; y < maze.length; y++) {
                for (let x = 0; x < maze[y].length; x++) {
                    if (maze[y][x] === 1) { // Wall
                        ctx.fillStyle = 'blue';
                        ctx.fillRect(x * TILE_SIZE, y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
                    }
                }
            }

            // Draw pellets
            ctx.fillStyle = 'white';
            pellets.forEach(p => {
                ctx.beginPath();
                ctx.arc(p.x * TILE_SIZE + TILE_SIZE / 2, p.y * TILE_SIZE + TILE_SIZE / 2, 3, 0, Math.PI * 2);
                ctx.fill();
            });

            // Draw power pellets
            ctx.fillStyle = 'orange';
            powerPellets.forEach(p => {
                ctx.beginPath();
                ctx.arc(p.x * TILE_SIZE + TILE_SIZE / 2, p.y * TILE_SIZE + TILE_SIZE / 2, 8, 0, Math.PI * 2);
                ctx.fill();
            });

            // Draw players (Pac-Man style: mouth opens/closes, faces movement direction).
            // Smooth sine-wave chomp (period ~150ms) for fluid animation, independent
            // of packet timing since this runs in the rAF loop.
            var chompPhase = (performance.now() / 75) % (Math.PI * 2);
            var mouthAngle = (Math.sin(chompPhase) * 0.5 + 0.5) * (Math.PI / 4);

            // --- Tunnel ghost rendering ----------------------------------------
            // On tunnel rows, when a sprite is within half a tile of either
            // horizontal edge, draw a faded copy on the opposite side so it
            // appears to slide through the tunnel instead of popping.
            function tunnelOffsets(x, y) {
                var tileY = Math.floor(y);
                var offsets = [0];
                // Only tunnel rows (leftmost tile is type 4) wrap.
                if (tileY >= 0 && tileY < maze.length && maze[tileY][0] === 4) {
                    var w = maze[0].length;
                    if (x < 0.5) offsets.push(w);       // ghost on the right
                    else if (x > w - 0.5) offsets.push(-w); // ghost on the left
                }
                return offsets;
            }
            players.forEach(p => {
                // Track last non-null direction so the mouth keeps facing when stopped.
                if (p.direction) playerLastDirs[p.id] = p.direction;
                var dir = playerLastDirs[p.id] || 'right';

                // Direction angle: 0=right, π/2=down, π=left, -π/2=up.
                var dirAngle = 0;
                if (dir === 'down') dirAngle = Math.PI / 2;
                else if (dir === 'left') dirAngle = Math.PI;
                else if (dir === 'up') dirAngle = -Math.PI / 2;

                // On tunnel rows, draw a faded "ghost" copy on the opposite edge
                // so the sprite appears to slide through instead of popping.
                var offsets = tunnelOffsets(p.x, p.y);
                offsets.forEach(function (off, idx) {
                    // The ghost copy (non-zero offset) is drawn faded.
                    if (off !== 0) ctx.globalAlpha = 0.4;

                    var px = (p.x + off) * TILE_SIZE;
                    var py = p.y * TILE_SIZE;

                    // Dash glow effect: cyan outline when dashing.
                    if (p.dashing) {
                        ctx.strokeStyle = '#0ff';
                        ctx.lineWidth = 3;
                        ctx.beginPath();
                        ctx.arc(px, py, TILE_SIZE / 2 - 2 + 3, 0, Math.PI * 2);
                        ctx.stroke();
                        ctx.lineWidth = 1;
                    }

                    ctx.fillStyle = p.poweredUp ? 'orange' : p.color;
                    ctx.beginPath();
                    // Reference proportion: TILE_SIZE / 2 - 2. This makes Pac-Man fill the
                    // corridor (radius ≈ half a tile) so it sits centered on the pellet
                    // line. A smaller radius (the old TILE_SIZE/2.5) left the character
                    // floating and visually misaligned with pellets.
                    ctx.arc(px, py, TILE_SIZE / 2 - 2,
                        dirAngle + mouthAngle, dirAngle + Math.PI * 2 - mouthAngle);
                    ctx.lineTo(px, py);
                    ctx.fill();

                    ctx.globalAlpha = 1;
                });
            });

            // Draw ghosts (colored body, blue+flash when frightened, eyes-only when eaten).
            // On tunnel rows, also draw a faded ghost copy on the opposite edge.
            ghosts.forEach(g => {
                var offsets = tunnelOffsets(g.x, g.y);
                offsets.forEach(function (off, idx) {
                    if (off !== 0) ctx.globalAlpha = 0.4;
                    var origX = g.x;
                    g.x = g.x + off;
                    GhostRenderer.drawGhost(ctx, g, TILE_SIZE);
                    g.x = origX;
                    ctx.globalAlpha = 1;
                });
            });

            // Ghost eaten sound: detect when a ghost transitions to eaten state near us.
            // Eaten ghosts stay in the list (they return to the house), so we track the
            // previous eaten flag per ghost rather than looking for vanished ghosts.
            if (myPlayer && myPlayer.poweredUp) {
                const newlyEaten = ghosts.filter(g => {
                    if (!g.eaten) return false;
                    const prev = lastGhostPositions.find(lg => lg.id === g.id);
                    return prev && !prev.eaten; // was not eaten last frame, now eaten
                });
                const eatenByMe = newlyEaten.some(g => {
                    const dist = Math.hypot(myPlayer.x - g.x, myPlayer.y - g.y);
                    return dist < 1.0;
                });
                if (eatenByMe) {

            }
            lastGhostPositions = ghosts.map(g => ({ id: g.id, x: g.x, y: g.y, eaten: g.eaten }));

            // Extra-life sound: detect when our lives increase (server awards at score thresholds).
            if (myPlayer && lastLives > 0 && myPlayer.lives > lastLives) {
                playExtraLife();
            }
            // Death-with-respawn sound: detect when our lives decrease. This fires when
            // we lose a life but still have lives left (the final-death case is handled
            // separately by the spectatorMode message, which removes us from players[]).
            if (myPlayer && lastLives > 0 && myPlayer.lives < lastLives) {
                playPlayerEaten();
            }
            if (myPlayer) lastLives = myPlayer.lives;

            // Draw scores and lives
            ctx.fillStyle = 'white';
            ctx.font = '20px Arial';
            players.forEach((p, index) => {
                ctx.fillText(`Player ${index + 1}: ${p.score} Lives: ${p.lives}`, 10, 25 * (index + 1));

            // Draw current level (top-right corner) during active play
            if (clientGameState === 'IN_PROGRESS') {

            // Draw dash cooldown indicator (bottom-left) for the current player.
            if (clientGameState === 'IN_PROGRESS' && myPlayer) {
                const cooldown = myPlayer.dashCooldownTicks || 0;
                const active = myPlayer.dashActiveTicks || 0;
                const TICKS_PER_SECOND = 60;
                const cooldownSec = (cooldown / TICKS_PER_SECOND).toFixed(1);
                const DASH_COOLDOWN_TICKS = 180;
                const DASH_DURATION_TICKS = 15;
                ctx.font = '16px Arial';
                ctx.textAlign = 'left';
                if (active > 0) {
                    ctx.fillStyle = '#0ff';
                    ctx.fillText(`DASHING! ${active}/${DASH_DURATION_TICKS}`, 10, canvas.height - 10);
                } else if (cooldown > 0) {
                    ctx.fillStyle = '#888';
                    ctx.fillText(`Dash: ${cooldownSec}s`, 10, canvas.height - 10);
                } else {
                    ctx.fillStyle = '#0f0';
                    ctx.fillText('Dash ready [Shift]', 10, canvas.height - 10);
                }
            }

            // --- Position debug overlay (toggle with 'P') ---
            // Shows each player's tile position, the corridor center (half-tile)
            // they should be on, and the drift (offset) between them. Helps verify
            // that the perpendicular-axis snap on turns keeps sprites aligned with
            // the pellet line. Green = on line (<0.05 tiles), yellow = minor drift,
            // red = significant drift.
            //
            // Visual markers:
            //   - Dashed line along the corridor center the player should be on.
            //   - Crosshair at the player's actual sprite center.
            //   - If the snap fix works, the crosshair sits on the line. Any gap
            //     is drift made visible.
            if (showPosDebug) {
                ctx.font = '12px monospace';
                ctx.textAlign = 'left';
                ctx.save();
                ctx.setLineDash([4, 4]);
                players.forEach((p, idx) => {
                    var isVertical = (p.direction === 'up' || p.direction === 'down');
                    // The corridor center the player should be on for their current axis.
                    var corridor = isVertical
                        ? Math.round(p.x - 0.5) + 0.5  // moving vertically -> X must be half-tile
                        : Math.round(p.y - 0.5) + 0.5; // moving horizontally -> Y must be half-tile
                    var drift = isVertical
                        ? Math.abs(p.x - corridor)
                        : Math.abs(p.y - corridor);
                    var color = drift < 0.05 ? '#0f0' : drift < 0.15 ? '#ff0' : '#f33';

                    // Draw the corridor center line the player should be on.
                    ctx.strokeStyle = color;
                    ctx.lineWidth = 1;
                    if (isVertical) {
                        // Vertical movement: corridor center is a vertical line at X.
                        ctx.beginPath();
                        ctx.moveTo(corridor * TILE_SIZE, 0);
                        ctx.lineTo(corridor * TILE_SIZE, maze.length * TILE_SIZE);
                        ctx.stroke();
                    } else {
                        // Horizontal movement: corridor center is a horizontal line at Y.
                        ctx.beginPath();
                        ctx.moveTo(0, corridor * TILE_SIZE);
                        ctx.lineTo(maze[0].length * TILE_SIZE, corridor * TILE_SIZE);
                        ctx.stroke();
                    }

                    // Draw a crosshair at the player's actual center.
                    var px = p.x * TILE_SIZE;
                    var py = p.y * TILE_SIZE;
                    ctx.strokeStyle = color;
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(px - 8, py);
                    ctx.lineTo(px + 8, py);
                    ctx.moveTo(px, py - 8);
                    ctx.lineTo(px, py + 8);
                    ctx.stroke();

                    // Numeric readout.
                    ctx.fillStyle = color;
                    ctx.fillText(
                        `${p.name || 'P' + (idx + 1)} pos=(${p.x.toFixed(2)},${p.y.toFixed(2)}) center=${corridor.toFixed(1)} drift=${drift.toFixed(3)}`,
                        10, canvas.height - 50 - idx * 16
                    );
                });
                ctx.restore();
                if (players.length === 0) {
                    ctx.fillStyle = '#888';
                    ctx.fillText('(no players — press P to toggle)', 10, canvas.height - 50);
                }
                ctx.textAlign = 'left';
            }

            // --- Overlays (drawn every frame so they survive the rAF render loop) ---

            // Spectating during active play.
            if (!myPlayer && clientGameState === 'IN_PROGRESS') {
                ctx.fillStyle = 'white';
                ctx.font = '30px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('You are spectating...', canvas.width / 2, canvas.height / 2 + 50);
            }

            if (clientGameState === 'GAME_OVER' && latestServerState) {
                const winner = latestServerState.players.length > 0 ? latestServerState.players[0].name : 'No one';
                const heading = `Game Over! Winner: ${winner}`;

                ctx.textAlign = 'center';

                // Decorative panel: rounded rect behind the heading with a soft
                // red→black gradient and a subtle outer glow.
                ctx.font = '48px Arial';
                const textW = ctx.measureText(heading).width;
                const panelX = canvas.width / 2 - textW / 2 - 24;
                const panelY = canvas.height / 2 - 52;
                const panelW = textW + 48;
                const panelH = 72;
                ctx.save();
                ctx.shadowColor = 'rgba(255,0,0,0.55)';
                ctx.shadowBlur = 28;
                const grad = ctx.createLinearGradient(panelX, panelY, panelX, panelY + panelH);
                grad.addColorStop(0, 'rgba(60,0,0,0.85)');
                grad.addColorStop(1, 'rgba(20,0,0,0.85)');
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.roundRect(panelX, panelY, panelW, panelH, 14);
                ctx.fill();
                // Border accent.
                ctx.shadowBlur = 0;
                ctx.strokeStyle = 'rgba(255,80,80,0.7)';
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.restore();

                // Heading with a subtle glow.
                ctx.save();
                ctx.shadowColor = 'rgba(255,60,60,0.8)';
                ctx.shadowBlur = 18;
                ctx.fillStyle = '#ff4444';
                ctx.fillText(heading, canvas.width / 2, canvas.height / 2);
                ctx.restore();
                if (showNewHighScore) {
                    ctx.fillStyle = '#ffd700';
                    ctx.font = '36px Arial';
                    ctx.fillText('New High Score!', canvas.width / 2, canvas.height / 2 + 80);
                } else if (showHighScore) {
                    ctx.fillStyle = '#ffd700';
                    ctx.font = '28px Arial';
                    ctx.fillText('High Score!', canvas.width / 2, canvas.height / 2 + 80);
                }
                if (!myPlayer) {
                    ctx.fillStyle = 'white';
                    ctx.font = '30px Arial';
                    ctx.fillText('You are spectating.', canvas.width / 2, canvas.height / 2 + 120);
                }
            }

            if (clientGameState === 'LEVEL_COMPLETE' && latestServerState) {
                ctx.fillStyle = 'lime';
                ctx.font = '60px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(`Level ${latestServerState.level - 1} Complete!`, canvas.width / 2, canvas.height / 2 - 20);
                ctx.fillStyle = 'white';
                ctx.font = '30px Arial';
                ctx.fillText(`Get ready for Level ${latestServerState.level}...`, canvas.width / 2, canvas.height / 2 + 30);
            }
        }

    </script>
</body>
</html>
