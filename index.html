<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pacclone Multi</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👻</text></svg>">
    <style>
        body { margin: 0; background-color: #000; display: flex; justify-content: center; align-items: center; height: 100vh; }
        canvas { background-color: #000; }
    </style>
</head>
<body>
    <div id="lobby" style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; width: 100vw; background-color: #000; color: white;">
        <h1>Pacclone Multi Lobby</h1>
        <div style="margin-bottom: 20px;">
            <label for="playerNameInput">Your Name:</label>
            <input type="text" id="playerNameInput" placeholder="Enter your name" style="padding: 8px; font-size: 16px;">
            <button id="joinLobbyButton" style="padding: 8px 15px; font-size: 16px; margin-left: 10px;">Join Lobby</button>
        </div>
        <div id="lobbyPlayersList" style="margin-bottom: 20px;">
            <h2>Players in Lobby:</h2>
            <ul id="playersList" style="list-style-type: none; padding: 0;">
                <!-- Player names will be inserted here by JavaScript -->
            </ul>
        </div>
        <div id="highScores" style="margin-bottom: 20px; color: #ffd700;">
            <h2 style="color: #ffd700;">High Scores</h2>
            <ol id="highScoresList" style="padding-left: 20px; margin: 5px 0;"></ol>
        </div>
        <div style="margin-bottom: 10px;">
            <button id="muteButton" style="padding: 6px 14px; font-size: 14px; background-color: #333; color: #fff; border: 1px solid #666; cursor: pointer;">Mute</button>
        </div>
        <button id="startGameButton" style="padding: 10px 20px; font-size: 18px; background-color: green; color: white; border: none; cursor: pointer;" disabled>Start Game</button>
        <div id="hostStatus" style="margin-top: 15px; font-size: 14px; color: #aaa; min-height: 20px;"></div>
    </div>
    <canvas id="gameCanvas" width="800" height="520" style="display: none;"></canvas>

    <!-- Virtual Joystick for Touch Controls (NEW) -->
    <div id="joystick" style="display: none; position: fixed; bottom: 50px; left: 50px; width: 100px; height: 100px; background-color: rgba(255, 255, 255, 0.3); border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.5);">
        <div id="joystick-handle" style="position: absolute; top: 25px; left: 25px; width: 50px; height: 50px; background-color: rgba(255, 255, 255, 0.7); border-radius: 50%;"></div>
    </div>

    <script src="src/ghostRenderer.js"></script>
    <script src="src/highScores.js"></script>
    <script src="src/audio.js"></script>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const lobbyDiv = document.getElementById('lobby');
        const playerNameInput = document.getElementById('playerNameInput');
        const joinLobbyButton = document.getElementById('joinLobbyButton');
        const playersList = document.getElementById('playersList');
        const startGameButton = document.getElementById('startGameButton');
        const hostStatus = document.getElementById('hostStatus');
        
        const TILE_SIZE = 40;
        let myPlayerId = null;
        let currentPlayerName = '';
        let clientGameState = 'LOBBY'; // Client-side representation of game state
        let isSpectating = false; // true when the player is out of lives and watching
        let lastScore = 0; // for chomp sound
        let lastLives = 0; // for extra-life sound
        let lastPoweredUpState = false; // for power-up sound
        let lastGhostPositions = []; // for ghost eaten sound
        let highScores = HighScores.loadHighScores();
        let finalScoreRecorded = false;
        let gameOverSoundPlayed = false; // one-shot guard for game-over SFX

        // Render the high score list into an element using the HighScores module.
        function renderHighScores(el) {
            if (!el) return;
            if (highScores.length === 0) {
                el.innerHTML = '<li style="color:#666">No scores yet</li>';
                return;
            }
            el.innerHTML = highScores.map((e, i) =>
                `<li>${i + 1}. ${HighScores.escapeHtml(e.name)} — ${e.score}</li>`
            ).join('');
        }

        // --- Audio (src/audio.js — chiptune SFX) ---
        // AudioContext must be created/resumed on a user gesture. We init on the
        // first lobby interaction; until then sounds are no-ops.
        var audioInitialized = false;
        function ensureAudio() {
            if (!audioInitialized) {
                AudioFX.init();
                audioInitialized = true;
            }
        }

        // Map the old sound variables to AudioFX calls so existing trigger
        // points keep working. New sounds (dash, celebrate, extra-life, etc.)
        // are added where the gameplay events occur.
        function playChomp() { ensureAudio(); AudioFX.playChomp(); }
        function playPowerup() { ensureAudio(); AudioFX.playPowerup(); }
        function playGhostEaten() { ensureAudio(); AudioFX.playEatGhost(); }
        function playPlayerEaten() { ensureAudio(); AudioFX.playDeath(); }
        function playGameOver() { ensureAudio(); AudioFX.playGameOver(); }
        function playDash() { ensureAudio(); AudioFX.playDash(); }
        function playCelebrate() { ensureAudio(); AudioFX.playCelebrate(); }
        function playExtraLife() { ensureAudio(); AudioFX.playExtraLife(); }
        function playHighScore() { ensureAudio(); AudioFX.playHighScore(); }
        function playStart() { ensureAudio(); AudioFX.playStart(); }

        // High score functions are provided by src/highScores.js (HighScores global).


        // Initial UI state
        canvas.style.display = 'none';
        lobbyDiv.style.display = 'flex';

        const ws = new WebSocket(`ws://${window.location.host}`);

        ws.onopen = () => {
            console.log('[CLIENT] Connected to server.');
            // When connected, if there's a stored player name, pre-fill it
            const storedPlayerName = localStorage.getItem('pacclonePlayerName');
            if (storedPlayerName) {
                playerNameInput.value = storedPlayerName;
            }
            // Do NOT automatically join lobby here. Wait for lobbyState from server.
        };

        // NEW: Event Listeners for Lobby Buttons
        joinLobbyButton.addEventListener('click', () => {
            ensureAudio(); // Unlock AudioContext on first user gesture.
            const playerName = playerNameInput.value.trim();
            if (playerName) {
                localStorage.setItem('pacclonePlayerName', playerName); // Store name
                currentPlayerName = playerName;
                ws.send(JSON.stringify({ type: 'joinLobby', name: playerName }));
            } else {
                alert('Please enter your name to join the lobby.');
            }
        });

        startGameButton.addEventListener('click', () => {
            ensureAudio();
            ws.send(JSON.stringify({ type: 'startGame' }));
        });

        const muteButton = document.getElementById('muteButton');
        muteButton.addEventListener('click', () => {
            ensureAudio();
            const muted = AudioFX.toggleMute();
            muteButton.textContent = muted ? 'Unmute' : 'Mute';
        });

        ws.onmessage = (event) => {
            const message = JSON.parse(event.data);
            console.log('[CLIENT] Message received:', message.type);
            switch (message.type) {
                case 'welcome':
                    console.log(`[SERVER] says: ${message.message}`);
                    myPlayerId = message.clientId; // Capture clientId from welcome message
                    break;
                case 'playerAssigned':
                    // Server tells us our player ID for the new game. This restores
                    // the ID after a previous game where we may have been a spectator.
                    myPlayerId = message.playerId;
                    isSpectating = false;
                    console.log(`[CLIENT] Assigned player ID: ${myPlayerId}`);
                    break;
                case 'lobbyState':
                    clientGameState = message.currentGameState;
                    // Returning to lobby (e.g. after game over) clears spectating.
                    if (clientGameState === 'LOBBY') {
                        isSpectating = false;
                        finalScoreRecorded = false;
                    }
                    // Update lobby player list
                    playersList.innerHTML = '';
                    if (message.lobbyPlayers && message.lobbyPlayers.length > 0) {
                        message.lobbyPlayers.forEach(p => {
                            const li = document.createElement('li');
                            li.textContent = p.name;
                            playersList.appendChild(li);
                        });
                    }
                    // Refresh high score display whenever we return to lobby.
                    renderHighScores(document.getElementById('highScoresList'));
                    if (message.lobbyPlayers && message.lobbyPlayers.length > 0) {
                        // Assume the first player in the lobby is the host
                        const isHost = (message.lobbyPlayers[0].id === myPlayerId);
                        startGameButton.disabled = !(isHost && message.lobbyPlayers.length >= 1); // Enable if host and at least 1 player

                        // UI feedback: tell players who the host is and who can start
                        if (isHost) {
                            hostStatus.textContent = 'You are the host — press Start Game when ready.';
                            hostStatus.style.color = '#4ade80'; // green
                        } else {
                            const hostName = message.lobbyPlayers[0].name;
                            hostStatus.textContent = `Host: ${hostName} — waiting for them to start the game.`;
                            hostStatus.style.color = '#fbbf24'; // amber
                        }
                    } else {
                        startGameButton.disabled = true;
                        hostStatus.textContent = 'Waiting for players to join...';
                        hostStatus.style.color = '#aaa';
                    }
                    // NEW: Explicitly manage UI visibility based on currentGameState
                    if (clientGameState === 'LOBBY') {
                         lobbyDiv.style.display = 'flex';
                         canvas.style.display = 'none';
                    } else { // If we receive lobbyState while not in LOBBY, e.g., during IN_PROGRESS for some reason
                         lobbyDiv.style.display = 'none';
                         canvas.style.display = 'block';
                    }
                    break;
                case 'gameState':
                    console.log('[CLIENT] GameState received. Current State:', clientGameState, 'My Player ID:', myPlayerId);
                    const prevState = clientGameState;
                    clientGameState = message.gameState.currentGameState; // Assuming server sends currentGameState in gameState
                    // Reset high score recording flag when a new game/level starts.
                    if (clientGameState === 'IN_PROGRESS' && prevState !== 'IN_PROGRESS') {
                        finalScoreRecorded = false;
                        gameOverSoundPlayed = false;
                        playStart();
                    }
                    if (clientGameState === 'IN_PROGRESS' || clientGameState === 'GAME_OVER' || clientGameState === 'LEVEL_COMPLETE') {
                        lobbyDiv.style.display = 'none';
                        canvas.style.display = 'block';

                        console.log('[CLIENT] Calling render() with gameState:', message.gameState);
                        render(message.gameState); // Always render the game elements

                        const activePlayer = message.gameState.players.find(p => p.id === myPlayerId);

                        // If spectating in IN_PROGRESS state, draw a spectator message
                        if (!activePlayer && clientGameState === 'IN_PROGRESS') {
                            ctx.fillStyle = 'white';
                            ctx.font = '30px Arial';
                            ctx.textAlign = 'center';
                            ctx.fillText('You are spectating...', canvas.width / 2, canvas.height / 2 + 50);
                        }

                        // If game is over, display message
                        if (clientGameState === 'GAME_OVER') {
                            ctx.fillStyle = 'red';
                            ctx.font = '80px Arial';
                            ctx.textAlign = 'center';
                            const winner = message.gameState.players.length > 0 ? message.gameState.players[0].name : 'No one';
                            ctx.fillText(`Game Over! Winner: ${winner}`, canvas.width / 2, canvas.height / 2);

                            // Record high score once per game over.
                            if (!finalScoreRecorded) {
                                finalScoreRecorded = true;
                                gameOverSoundPlayed = false; // will be set true below after playing
                                // At GAME_OVER, dead players are removed from the players array
                                // (they became spectators). Use the client-tracked score as the
                                // authoritative final score; fall back to the server's player
                                // object only for the winner (who remains in the array).
                                const myFinalPlayer = message.gameState.players.find(p => p.id === myPlayerId);
                                const finalScore = myFinalPlayer ? myFinalPlayer.score : lastScore;
                                const previousTop = highScores.length ? highScores[0].score : 0;
                                highScores = HighScores.insertHighScore(currentPlayerName, finalScore);
                                const isNewTop = highScores.length > 0 && highScores[0].score === finalScore && finalScore > 0;
                                const isHighScore = finalScore > 0 && highScores.some(e => e.score === finalScore && e.name === currentPlayerName);
                                if (isNewTop && finalScore > previousTop) {
                                    ctx.fillStyle = '#ffd700';
                                    ctx.font = '36px Arial';
                                    ctx.fillText('New High Score!', canvas.width / 2, canvas.height / 2 + 80);
                                    playHighScore();
                                } else if (isHighScore) {
                                    ctx.fillStyle = '#ffd700';
                                    ctx.font = '28px Arial';
                                    ctx.fillText('High Score!', canvas.width / 2, canvas.height / 2 + 80);
                                }
                            }

                            if (!activePlayer) { // If spectating during game over
                                ctx.fillStyle = 'white';
                                ctx.font = '30px Arial';
                                ctx.fillText('You are spectating.', canvas.width / 2, canvas.height / 2 + 120);
                            }
                        }

                        // Level complete overlay (brief transition between levels)
                        if (clientGameState === 'LEVEL_COMPLETE') {
                            playCelebrate();
                            ctx.fillStyle = 'lime';
                            ctx.font = '60px Arial';
                            ctx.textAlign = 'center';
                            ctx.fillText(`Level ${message.gameState.level - 1} Complete!`, canvas.width / 2, canvas.height / 2 - 20);
                            ctx.fillStyle = 'white';
                            ctx.font = '30px Arial';
                            ctx.fillText(`Get ready for Level ${message.gameState.level}...`, canvas.width / 2, canvas.height / 2 + 30);
                        }
                    } else if (clientGameState === 'LOBBY') { // Back to lobby state
                         lobbyDiv.style.display = 'flex';
                         canvas.style.display = 'none';
                    }
                    if (clientGameState === 'GAME_OVER' && !gameOverSoundPlayed) {
                        gameOverSoundPlayed = true;
                        playGameOver();
                    }
                    break;
                                            case 'spectatorMode': // Handle spectatorMode message
                                                clientGameState = 'SPECTATING';
                                                isSpectating = true; // Mark as spectating (keep myPlayerId set)
                                                lobbyDiv.style.display = 'none';
                                                canvas.style.display = 'block';
                                                // Display a message to the user that they are spectating
                                                ctx.clearRect(0, 0, canvas.width, canvas.height); // Clear canvas
                                                ctx.fillStyle = 'white';
                                                ctx.font = '40px Arial';
                                                ctx.textAlign = 'center';
                                                ctx.fillText(message.message, canvas.width / 2, canvas.height / 2 - 50);
                                                ctx.fillText('Spectating...', canvas.width / 2, canvas.height / 2 + 50);
                                                playPlayerEaten(); // Play player eaten sound
                                                break;
                case 'error':
                    console.error('[SERVER ERROR]:', message.message);
                    alert(`Error: ${message.message}`);
                    break;
            }
        };

        ws.onclose = () => {
            console.log('[CLIENT] Disconnected from server.');
        };

        // Keyboard Input
        // Track Shift key state for dash (held = dash active).
        let shiftHeld = false;
        let lastDirection = null;
        document.addEventListener('keydown', (event) => {
            if (event.key === 'Shift') {
                shiftHeld = true;
                event.preventDefault();
                // Re-send current direction so the dash takes effect immediately.
                if (myPlayerId && !isSpectating && lastDirection) {
                    ws.send(JSON.stringify({ type: 'input', direction: lastDirection, dash: true }));
                    playDash();
                }
                return;
            }
            if (!myPlayerId || isSpectating) { // Do not send input if spectating
                return;
            }
            let direction = null;
            switch(event.key) {
                case 'ArrowUp':
                case 'w':
                    direction = 'up';
                    break;
                case 'ArrowDown':
                case 's':
                    direction = 'down';
                    break;
                case 'ArrowLeft':
                case 'a':
                    direction = 'left';
                    break;
                case 'ArrowRight':
                case 'd':
                    direction = 'right';
                    break;
            }
            if (direction) {
                lastDirection = direction;
                ws.send(JSON.stringify({ type: 'input', direction, dash: shiftHeld }));
            }
        });
        document.addEventListener('keyup', (event) => {
            if (event.key === 'Shift') {
                shiftHeld = false;
            }
        });
        
        // Gamepad Input (NEW SECTION)
        let gamepads = {};

        function gamepadHandler(event, connected) {
            const gamepad = event.gamepad;
            if (connected) {
                gamepads[gamepad.index] = gamepad;
                console.log(`Gamepad ${gamepad.index} connected: ${gamepad.id}`);
            } else {
                delete gamepads[gamepad.index];
                console.log(`Gamepad ${gamepad.index} disconnected: ${gamepad.id}`);
            }
        }

        window.addEventListener('gamepadconnected', (e) => gamepadHandler(e, true));
        window.addEventListener('gamepaddisconnected', (e) => gamepadHandler(e, false));

        function pollGamepads() {
            if (!myPlayerId || isSpectating) { // Do not process gamepad input if spectating
                requestAnimationFrame(pollGamepads);
                return;
            }

            const currentGamepads = navigator.getGamepads();
            for (const gamepad of currentGamepads) {
                if (gamepad) {
                    // Check D-pad or Left Analog Stick
                    let direction = null;

                    // D-pad
                    if (gamepad.buttons[12] && gamepad.buttons[12].pressed) direction = 'up';
                    else if (gamepad.buttons[13] && gamepad.buttons[13].pressed) direction = 'down';
                    else if (gamepad.buttons[14] && gamepad.buttons[14].pressed) direction = 'left';
                    else if (gamepad.buttons[15] && gamepad.buttons[15].pressed) direction = 'right';

                    // Left Analog Stick (axes[0] for X, axes[1] for Y)
                    const AXIS_THRESHOLD = 0.5;
                    if (gamepad.axes[1] < -AXIS_THRESHOLD) direction = 'up';
                    else if (gamepad.axes[1] > AXIS_THRESHOLD) direction = 'down';
                    else if (gamepad.axes[0] < -AXIS_THRESHOLD) direction = 'left';
                    else if (gamepad.axes[0] > AXIS_THRESHOLD) direction = 'right';

                    // Dash: right shoulder button (button 5 / R1).
                    const dash = gamepad.buttons[5] && gamepad.buttons[5].pressed;

                    if (direction || dash) {
                        ws.send(JSON.stringify({ type: 'input', direction, dash }));
                    }
                }
            }
            requestAnimationFrame(pollGamepads);
        }
        requestAnimationFrame(pollGamepads); // Start polling

        // Touch Controls (Virtual Joystick) (NEW SECTION)
        const joystick = document.getElementById('joystick');
        const joystickHandle = document.getElementById('joystick-handle');
        const joystickBaseSize = 100; // Base size of the joystick area
        const joystickHandleSize = 50; // Size of the movable handle
        let joystickActive = false;
        let joystickStartX, joystickStartY;
        let joystickCurrentX, joystickCurrentY;

        // Function to show/hide joystick based on device type (simple check)
        function toggleJoystickVisibility() {
            // Check for touch support
            if ('ontouchstart' in window || navigator.maxTouchPoints > 0 || navigator.msMaxTouchPoints > 0) {
                // Joystick is initially hidden, will show on first touch
                // We'll manage its display based on game state
            }
        }
        toggleJoystickVisibility(); // Call once on load

        // Touch state for dash (double-tap) and joystick direction memory.
        let lastTouchDirection = null;
        const DOUBLE_TAP_MS = 300;

        document.addEventListener('touchstart', (e) => {
            if (!myPlayerId || clientGameState !== 'IN_PROGRESS') {
                return; // Only process input if active player and game in progress
            }
            if (e.target === canvas) { // Only activate joystick if touch starts on canvas
                joystickActive = true;
                joystick.style.display = 'block'; // Show joystick
                
                const touch = e.touches[0];
                joystickStartX = touch.clientX;
                joystickStartY = touch.clientY;
                
                // Position joystick dynamically at touch start location
                joystick.style.left = `${joystickStartX - joystickBaseSize / 2}px`;
                joystick.style.top = `${joystickStartY - joystickBaseSize / 2}px`;

                joystickHandle.style.left = `${joystickBaseSize / 4}px`;
                joystickHandle.style.top = `${joystickBaseSize / 4}px`;
                e.preventDefault();
            }
        }, { passive: false });

        document.addEventListener('touchmove', (e) => {
            if (!joystickActive || !myPlayerId || clientGameState !== 'IN_PROGRESS') {
                return;
            }
            const touch = e.touches[0];
            joystickCurrentX = touch.clientX;
            joystickCurrentY = touch.clientY;

            const deltaX = joystickCurrentX - joystickStartX;
            const deltaY = joystickCurrentY - joystickStartY;

            const maxDistance = joystickBaseSize / 2 - joystickHandleSize / 2;
            const angle = Math.atan2(deltaY, deltaX);
            const distance = Math.min(maxDistance, Math.hypot(deltaX, deltaY));

            const handleX = maxDistance + distance * Math.cos(angle) - joystickHandleSize / 2;
            const handleY = maxDistance + distance * Math.sin(angle) - joystickHandleSize / 2;

            joystickHandle.style.left = `${handleX}px`;
            joystickHandle.style.top = `${handleY}px`;

            let direction = null;
            if (distance > maxDistance * 0.5) { // Only send direction if moved enough
                if (Math.abs(deltaX) > Math.abs(deltaY)) {
                    direction = deltaX > 0 ? 'right' : 'left';
                } else {
                    direction = deltaY > 0 ? 'down' : 'up';
                }
            }
            if (direction) {
                lastTouchDirection = direction;
                ws.send(JSON.stringify({ type: 'input', direction }));
            }
            e.preventDefault();
        }, { passive: false });

        document.addEventListener('touchend', () => {
            joystickActive = false;
            joystick.style.display = 'none'; // Hide joystick
            joystickHandle.style.left = `${joystickBaseSize / 4}px`; // Reset handle position
            joystickHandle.style.top = `${joystickBaseSize / 4}px`;
        });

        // Double-tap detection for dash (touch). Uses the last joystick direction.
        let lastTapTime = 0;
        document.addEventListener('touchstart', (e) => {
            if (!myPlayerId || clientGameState !== 'IN_PROGRESS') return;
            const now = Date.now();
            if (now - lastTapTime < DOUBLE_TAP_MS && lastTouchDirection) {
                ws.send(JSON.stringify({ type: 'input', direction: lastTouchDirection, dash: true }));
                lastTapTime = 0; // prevent triple-tap retrigger
            } else {
                lastTapTime = now;
            }
        }, { passive: false });
        
        function render(gameState) {
            console.log('[CLIENT] Entering render function. GameState:', gameState);
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const { maze, players, ghosts, pellets, powerPellets, level = 1 } = gameState;
            const myPlayer = players.find(p => p.id === myPlayerId);
            console.log('[CLIENT] My Player:', myPlayer);

            // NEW: Sound triggers for current player
            if (myPlayer) {
                // Chomp sound
                if (myPlayer.score > lastScore) {
                    playChomp();
                }
                lastScore = myPlayer.score;

                // Power-up sound
                if (myPlayer.poweredUp && !lastPoweredUpState) {
                    playPowerup();
                }
                lastPoweredUpState = myPlayer.poweredUp;
            }

            // Draw maze
            for (let y = 0; y < maze.length; y++) {
                for (let x = 0; x < maze[y].length; x++) {
                    if (maze[y][x] === 1) { // Wall
                        ctx.fillStyle = 'blue';
                        ctx.fillRect(x * TILE_SIZE, y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
                    }
                }
            }

            // Draw pellets
            ctx.fillStyle = 'white';
            pellets.forEach(p => {
                ctx.beginPath();
                ctx.arc(p.x * TILE_SIZE + TILE_SIZE / 2, p.y * TILE_SIZE + TILE_SIZE / 2, 3, 0, Math.PI * 2);
                ctx.fill();
            });

            // Draw power pellets
            ctx.fillStyle = 'orange';
            powerPellets.forEach(p => {
                ctx.beginPath();
                ctx.arc(p.x * TILE_SIZE + TILE_SIZE / 2, p.y * TILE_SIZE + TILE_SIZE / 2, 8, 0, Math.PI * 2);
                ctx.fill();
            });

            // Draw players
            players.forEach(p => {
                // Dash glow effect: cyan outline when dashing.
                if (p.dashing) {
                    ctx.strokeStyle = '#0ff';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.arc(p.x * TILE_SIZE, p.y * TILE_SIZE, TILE_SIZE / 2.5 + 3, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.lineWidth = 1;
                }
                ctx.fillStyle = p.poweredUp ? 'orange' : p.color;
                ctx.beginPath();
                ctx.arc(p.x * TILE_SIZE, p.y * TILE_SIZE, TILE_SIZE / 2.5, 0, Math.PI * 2);
                ctx.fill();
            });

            // Draw ghosts (colored body, blue+flash when frightened, eyes-only when eaten)
            ghosts.forEach(g => {
                GhostRenderer.drawGhost(ctx, g, TILE_SIZE);
            });

            // Ghost eaten sound: detect when a ghost transitions to eaten state near us.
            // Eaten ghosts stay in the list (they return to the house), so we track the
            // previous eaten flag per ghost rather than looking for vanished ghosts.
            if (myPlayer && myPlayer.poweredUp) {
                const newlyEaten = ghosts.filter(g => {
                    if (!g.eaten) return false;
                    const prev = lastGhostPositions.find(lg => lg.id === g.id);
                    return prev && !prev.eaten; // was not eaten last frame, now eaten
                });
                const eatenByMe = newlyEaten.some(g => {
                    const dist = Math.hypot(myPlayer.x - g.x, myPlayer.y - g.y);
                    return dist < 1.0;
                });
                if (eatenByMe) {
                    playGhostEaten();
                }
            }
            lastGhostPositions = ghosts.map(g => ({ id: g.id, x: g.x, y: g.y, eaten: g.eaten }));

            // Extra-life sound: detect when our lives increase (server awards at score thresholds).
            if (myPlayer && lastLives > 0 && myPlayer.lives > lastLives) {
                playExtraLife();
            }
            if (myPlayer) lastLives = myPlayer.lives;

            // Draw scores and lives
            ctx.fillStyle = 'white';
            ctx.font = '20px Arial';
            players.forEach((p, index) => {
                ctx.fillText(`Player ${index + 1}: ${p.score} Lives: ${p.lives}`, 10, 25 * (index + 1));
            });

            // Draw current level (top-right corner) during active play
            if (clientGameState === 'IN_PROGRESS') {
                ctx.fillStyle = 'yellow';
                ctx.font = '18px Arial';
                ctx.textAlign = 'right';
                ctx.fillText(`Level ${level}`, canvas.width - 10, 25);
                ctx.textAlign = 'left';
            }

            // Draw dash cooldown indicator (bottom-left) for the current player.
            if (clientGameState === 'IN_PROGRESS' && myPlayer) {
                const cooldown = myPlayer.dashCooldownTicks || 0;
                const active = myPlayer.dashActiveTicks || 0;
                const TICKS_PER_SECOND = 60;
                const cooldownSec = (cooldown / TICKS_PER_SECOND).toFixed(1);
                const DASH_COOLDOWN_TICKS = 180;
                const DASH_DURATION_TICKS = 15;
                ctx.font = '16px Arial';
                ctx.textAlign = 'left';
                if (active > 0) {
                    ctx.fillStyle = '#0ff';
                    ctx.fillText(`DASHING! ${active}/${DASH_DURATION_TICKS}`, 10, canvas.height - 10);
                } else if (cooldown > 0) {
                    ctx.fillStyle = '#888';
                    ctx.fillText(`Dash: ${cooldownSec}s`, 10, canvas.height - 10);
                } else {
                    ctx.fillStyle = '#0f0';
                    ctx.fillText('Dash ready [Shift]', 10, canvas.height - 10);
                }
                ctx.textAlign = 'left';
            }

            // Game Over
            if (myPlayerId && !myPlayer) {
                ctx.fillStyle = 'red';
                ctx.font = '80px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('Game Over', canvas.width / 2, canvas.height / 2);
            }
        }

    </script>
</body>
</html>
